<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --line: rgba(255,255,255,0.25);
      --text: #f9fafb;
      --accent: #60a5fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1f2937, #0f172a 60%, #020617);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .scoreboard {
      width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .score {
      min-width: 80px;
      text-align: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 18px;
    }

    canvas {
      display: block;
      background: rgba(17, 24, 39, 0.95);
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      width: 900px;
      height: 500px;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="scoreboard">
      <div class="score" id="score-left">0</div>
      <div>POONG</div>
      <div class="score" id="score-right">0</div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreLeftEl = document.getElementById("score-left");
    const scoreRightEl = document.getElementById("score-right");

    const paddleWidth = 14;
    const paddleHeight = 90;
    const ballRadius = 10;

    const leftPaddle = {
      x: 20,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 8
    };

    const rightPaddle = {
      x: canvas.width - 20 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 6.2
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballRadius,
      vx: 5.5,
      vy: 3.5
    };

    let leftScore = 0;
    let rightScore = 0;
    const keys = {};

    function updateScoreboard() {
      scoreLeftEl.textContent = leftScore;
      scoreRightEl.textContent = rightScore;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = (Math.random() - 0.5) * 1.2;
      const speed = 5.8;

      ball.vx = direction === "left" ? -speed * Math.cos(angle) : speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function handlePaddleCollision(paddle, isLeft) {
      const ballLeft = ball.x - ball.radius;
      const ballRight = ball.x + ball.radius;
      const ballTop = ball.y - ball.radius;
      const ballBottom = ball.y + ball.radius;

      const paddleLeft = paddle.x;
      const paddleRight = paddle.x + paddle.width;
      const paddleTop = paddle.y;
      const paddleBottom = paddle.y + paddle.height;

      const colliding =
        ballRight >= paddleLeft &&
        ballLeft <= paddleRight &&
        ballBottom >= paddleTop &&
        ballTop <= paddleBottom;

      if (!colliding) return;

      const relativeIntersectY = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
      const bounceAngle = relativeIntersectY * 1.1;

      const maxSpeed = 12;
      const currentSpeed = Math.hypot(ball.vx, ball.vy) || 5.8;
      const newSpeed = Math.min(currentSpeed + 0.3, maxSpeed);

      if (isLeft) {
        ball.x = paddle.x + paddle.width + ball.radius;
      } else {
        ball.x = paddle.x - ball.radius;
      }

      const direction = isLeft ? 1 : -1;

      ball.vx = direction * (newSpeed * Math.cos(bounceAngle));
      ball.vy = newSpeed * Math.sin(bounceAngle);
    }

    function update() {
      // Mouse control for left paddle
      canvas.onmousemove = (event) => {
        const rect = canvas.getBoundingClientRect();
        const mouseY = ((event.clientY - rect.top) / rect.height) * canvas.height;
        leftPaddle.y = mouseY - leftPaddle.height / 2;
      };

      // Keyboard control for left paddle
      if (keys["ArrowUp"]) {
        leftPaddle.y -= leftPaddle.speed;
      }
      if (keys["ArrowDown"]) {
        leftPaddle.y += leftPaddle.speed;
      }

      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);

      // AI for right paddle
      const targetY = ball.y - rightPaddle.height / 2;
      rightPaddle.y += (targetY - rightPaddle.y) * 0.12;
      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);

      // Ball movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top/bottom wall collision
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      } else if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }

      // Left paddle collision
      handlePaddleCollision(leftPaddle, true);

      // Right paddle collision
      handlePaddleCollision(rightPaddle, false);

      // Scoring
      if (ball.x - ball.radius <= 0) {
        rightScore++;
        updateScoreboard();
        resetBall("right");
      } else if (ball.x + ball.radius >= canvas.width) {
        leftScore++;
        updateScoreboard();
        resetBall("left");
      }
    }

    function drawNet() {
      for (let y = 0; y < canvas.height; y += 20) {
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.fillRect(canvas.width / 2 - 2, y, 4, 12);
      }
    }

    function drawPaddle(paddle) {
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.fillStyle = "#fbbf24";
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background
      ctx.fillStyle = "#111827";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawNet();
      drawPaddle(leftPaddle);
      drawPaddle(rightPaddle);
      drawBall();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (event) => {
      keys[event.key] = true;
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        event.preventDefault();
      }
    });

    document.addEventListener("keyup", (event) => {
      keys[event.key] = false;
    });

    updateScoreboard();
    resetBall("left");
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
